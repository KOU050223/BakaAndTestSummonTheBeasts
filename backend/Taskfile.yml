version: '3'

tasks:
  default:
    aliases:
      - list
    desc: タスク一覧
    cmd: task -l
  
  install-deps:
    desc: バックエンドの依存関係をインストール
    cmd: bundle install
  
  dev:
    desc: バックエンドの開発サーバーを起動（ポート8000）
    cmd: bundle exec rails server -p 8000

  jobs:
    desc: Solid Queue ワーカーを起動（バックグラウンドジョブ処理）
    cmd: bundle exec rails solid_queue:start

  lint:
    desc: RuboCopでコードスタイルをチェックする
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    cmd: bin/rubocop -f github

  lint:fix:
    desc: RuboCopで自動修正可能な問題を修正する
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    cmd: bin/rubocop -A

  test:
    desc: RSpec でテストを実行する
    env:
      RAILS_ENV: test
    cmds:
      - bin/rails db:test:prepare
      - bundle exec rspec

  openapi:generate:
    desc: OpenAPI 仕様（swagger/v1/openapi.yaml）を rswag から再生成する
    env:
      RAILS_ENV: test
    cmds:
      - bin/rails db:test:prepare
      - bundle exec rake rswag:specs:swaggerize

  scan:ruby:
    desc: Rubyコードのセキュリティ脆弱性をスキャンする（brakeman）
    cmd: bin/brakeman --no-pager

  scan:gems:
    desc: Gemの既知の脆弱性をスキャンする（bundler-audit）
    cmd: bin/bundler-audit

  scan:
    desc: すべてのセキュリティスキャンを実行する
    deps:
      - scan:ruby
      - scan:gems

  ci:
    desc: CI相当のチェックをローカルで全て実行する（lint + test + scan）
    cmds:
      - task: lint
      - task: test
      - task: scan

