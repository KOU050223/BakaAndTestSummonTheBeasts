---
openapi: 3.0.1
info:
  title: バカとテストと召喚獣 API
  description: 学力バトルゲームのバックエンドAPI
  version: v1
paths:
  "/api/admin/users":
    post:
      summary: 管理者によるユーザー作成
      tags:
      - Admin
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '201':
          description: ユーザー作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
                required:
                - user
        '403':
          description: 権限なし（school_admin 以外）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: メールアドレス重複
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 鈴木先生
                email:
                  type: string
                  example: teacher@example.com
                password:
                  type: string
                  example: password123
                role:
                  "$ref": "#/components/schemas/Role"
              required:
              - name
              - email
              - password
              - role
        required: true
  "/api/auth/logout":
    delete:
      summary: ログアウト
      tags:
      - Auth
      security:
      - cookie_auth: []
      - {}
      responses:
        '200':
          description: Cookie なしでもログアウト成功（Cookie は削除済み扱い）
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
  "/api/auth/signup":
    post:
      summary: ユーザー登録
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '409':
          description: メールアドレス重複
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 山田太郎
                email:
                  type: string
                  example: newuser@example.com
                password:
                  type: string
                  example: password123
              required:
              - name
              - email
              - password
        required: true
  "/api/auth/login":
    post:
      summary: ログイン
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: student@example.com
                password:
                  type: string
                  example: password123
              required:
              - email
              - password
        required: true
  "/api/battles":
    get:
      summary: バトル一覧取得
      tags:
      - Battles
      security:
      - cookie_auth: []
      responses:
        '200':
          description: バトル一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  battles:
                    type: array
                    items:
                      type: object
                      properties:
                        battleId:
                          type: string
                        subjectId:
                          type: string
                        status:
                          type: string
                        opponentName:
                          type: string
                      required:
                      - battleId
                      - subjectId
                      - status
                      - opponentName
                required:
                - battles
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（school_admin は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: バトル作成
      tags:
      - Battles
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '201':
          description: 教師もバトル作成できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  battleId:
                    type: string
                  subjectId:
                    type: string
                  status:
                    type: string
                required:
                - battleId
                - subjectId
                - status
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（school_admin は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subjectId:
                  type: string
                  example: math
              required:
              - subjectId
        required: true
  "/api/battles/{id}/result":
    get:
      summary: バトル結果取得
      tags:
      - Battles
      security:
      - cookie_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: バトルID
        schema:
          type: string
      responses:
        '200':
          description: バトル結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  battleId:
                    type: string
                  winnerId:
                    type: string
                  loserId:
                    type: string
                  turnCount:
                    type: integer
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        turn:
                          type: integer
                        actorId:
                          type: string
                        action:
                          type: string
                        targetId:
                          type: string
                        damage:
                          type: integer
                      required:
                      - turn
                      - actorId
                      - action
                      - targetId
                      - damage
                required:
                - battleId
                - winnerId
                - loserId
                - turnCount
                - logs
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（school_admin は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/classes":
    get:
      summary: クラス一覧取得
      tags:
      - Classes
      security:
      - cookie_auth: []
      responses:
        '200':
          description: school_admin もクラス一覧を取得できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                      required:
                      - id
                      - name
                required:
                - classes
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/classes/{class_id}/students":
    get:
      summary: クラス内生徒一覧取得
      tags:
      - Classes
      security:
      - cookie_auth: []
      parameters:
      - name: class_id
        in: path
        required: true
        description: クラスID
        schema:
          type: string
      responses:
        '200':
          description: school_admin もクラス内生徒一覧を取得できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  classId:
                    type: string
                  students:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                      required:
                      - id
                      - name
                required:
                - classId
                - students
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/exams":
    get:
      summary: 試験一覧取得
      tags:
      - Exams
      security:
      - cookie_auth: []
      responses:
        '200':
          description: school_admin も試験一覧を取得できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  exams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        subjectId:
                          type: string
                        createdBy:
                          type: string
                      required:
                      - id
                      - title
                      - subjectId
                      - createdBy
                required:
                - exams
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: 試験作成
      tags:
      - Exams
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '201':
          description: school_admin も試験を作成できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  subjectId:
                    type: string
                  classId:
                    type: string
                  maxScore:
                    type: integer
                required:
                - id
                - title
                - subjectId
                - classId
                - maxScore
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: 数学 小テスト1
                subjectId:
                  type: string
                  example: math
                classId:
                  type: string
                  example: class_a
                maxScore:
                  type: integer
                  example: 100
              required:
              - title
              - subjectId
              - classId
              - maxScore
        required: true
  "/api/exams/{exam_id}/scores":
    get:
      summary: 試験別スコア一覧取得
      tags:
      - Exams
      security:
      - cookie_auth: []
      parameters:
      - name: exam_id
        in: path
        required: true
        description: 試験ID
        schema:
          type: string
      responses:
        '200':
          description: school_admin も試験別スコアを取得できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  examId:
                    type: string
                  scores:
                    type: array
                    items:
                      type: object
                      properties:
                        studentId:
                          type: string
                        name:
                          type: string
                        score:
                          type: integer
                      required:
                      - studentId
                      - name
                      - score
                required:
                - examId
                - scores
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/scores":
    post:
      summary: 点数一括登録
      tags:
      - Scores
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '201':
          description: school_admin も点数を登録できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  examId:
                    type: string
                  registeredCount:
                    type: integer
                required:
                - examId
                - registeredCount
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                examId:
                  type: string
                  example: exam_1
                scores:
                  type: array
                  items:
                    type: object
                    properties:
                      studentId:
                        type: string
                      score:
                        type: integer
                    required:
                    - studentId
                    - score
              required:
              - examId
              - scores
        required: true
  "/api/students/{id}/summon":
    get:
      summary: 召喚獣ステータス取得
      tags:
      - Students
      security:
      - cookie_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: 生徒ID
        schema:
          type: integer
      responses:
        '200':
          description: school_admin が他の生徒のステータスを参照できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  studentId:
                    type: string
                  summons:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        hp:
                          type: integer
                        attack:
                          type: integer
                        defense:
                          type: integer
                        speed:
                          type: integer
                      required:
                      - hp
                      - attack
                      - defense
                      - speed
                required:
                - studentId
                - summons
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（他の生徒による参照は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/me":
    get:
      summary: 認証ユーザー情報取得
      tags:
      - Users
      security:
      - cookie_auth: []
      responses:
        '200':
          description: 自分のユーザー情報
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: 未認証（token Cookie なし）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
servers:
- url: http://localhost:8000
  description: ローカル開発環境
components:
  securitySchemes:
    cookie_auth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    Role:
      type: string
      enum:
      - student
      - teacher
      - school_admin
    AuthResponse:
      type: object
      properties:
        user:
          "$ref": "#/components/schemas/User"
      required:
      - user
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          "$ref": "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
      - role
      - created_at
    error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
          required:
          - code
          - message
          - details
      required:
      - error
