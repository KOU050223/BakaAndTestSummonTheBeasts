---
openapi: 3.0.1
info:
  title: バカとテストと召喚獣 API
  description: 学力バトルゲームのバックエンドAPI
  version: v1
paths:
  "/api/admin/users":
    get:
      summary: 管理者によるユーザー一覧取得
      tags:
      - Admin
      security:
      - cookie_auth: []
      parameters:
      - name: role
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/Role"
        description: ロールで絞り込む（未指定なら全件）
      responses:
        '200':
          description: role 指定で絞り込む
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      "$ref": "#/components/schemas/User"
                  stats:
                    "$ref": "#/components/schemas/AdminUserSummary"
                required:
                - users
                - stats
        '403':
          description: 権限なし（school_admin 以外）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: 管理者によるユーザー作成
      tags:
      - Admin
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '201':
          description: ユーザー作成成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '403':
          description: 権限なし（school_admin 以外）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: メールアドレス重複
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AdminUserCreateRequest"
        required: true
  "/api/admin/users/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: 管理者によるユーザー更新
      tags:
      - Admin
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '200':
          description: ユーザー更新成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '403':
          description: 権限なし（school_admin 以外）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: メールアドレス重複
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AdminUserUpdateRequest"
        required: true
    delete:
      summary: 管理者によるユーザー削除
      tags:
      - Admin
      security:
      - cookie_auth: []
      responses:
        '204':
          description: ユーザー削除成功
        '403':
          description: 権限なし（school_admin 以外）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: 履歴に紐づくユーザーは削除できない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/auth/logout":
    delete:
      summary: ログアウト
      tags:
      - Auth
      security:
      - cookie_auth: []
      - {}
      responses:
        '200':
          description: Cookie なしでもログアウト成功（Cookie は削除済み扱い）
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
  "/api/auth/signup":
    post:
      summary: ユーザー登録
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '409':
          description: メールアドレス重複
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 山田太郎
                email:
                  type: string
                  example: newuser@example.com
                password:
                  type: string
                  example: password123
              required:
              - name
              - email
              - password
        required: true
  "/api/auth/login":
    post:
      summary: ログイン
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: student@example.com
                password:
                  type: string
                  example: password123
              required:
              - email
              - password
        required: true
  "/api/battles/opponents":
    get:
      summary: 対戦相手候補一覧取得
      tags:
      - Battles
      security:
      - cookie_auth: []
      description: 対戦相手にできる生徒一覧（自分は除く、クラスを問わない）。宣戦布告の相手選択に使う。
      responses:
        '200':
          description: 対戦相手候補一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  opponents:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                      required:
                      - id
                      - name
                required:
                - opponents
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（school_admin は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/battles":
    get:
      summary: バトル一覧取得
      tags:
      - Battles
      security:
      - cookie_auth: []
      responses:
        '200':
          description: バトル一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  battles:
                    type: array
                    items:
                      type: object
                      properties:
                        battleId:
                          type: string
                        subjects:
                          type: array
                          items:
                            type: string
                        status:
                          type: string
                        opponentName:
                          type: string
                          nullable: true
                      required:
                      - battleId
                      - subjects
                      - status
                required:
                - battles
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（school_admin は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: バトル作成
      tags:
      - Battles
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '201':
          description: バトル作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  battleId:
                    type: string
                  subjects:
                    type: array
                    items:
                      type: string
                  status:
                    type: string
                required:
                - battleId
                - subjects
                - status
        '422':
          description: 対戦科目が空（バリデーションエラー）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（school_admin は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                opponentId:
                  type: string
                  example: '2'
                  description: 対戦相手の生徒ID
                subjects:
                  type: array
                  items:
                    type: string
                  example:
                  - math
                  - english
                  - physics
                  description: 対戦科目（召喚フィールド）
              required:
              - opponentId
              - subjects
        required: true
  "/api/battles/declare_war":
    post:
      summary: クラス単位の宣戦布告（N:N対戦作成）
      tags:
      - Battles
      security:
      - cookie_auth: []
      description: 宣戦布告したクラスと相手クラスの生徒全員を陣営に分けて N:N バトルを作成する。attackerClassId 省略時は布告者の所属クラスを使う。
      parameters: []
      responses:
        '201':
          description: 宣戦布告成功（N:Nバトル作成）
          content:
            application/json:
              schema:
                type: object
                properties:
                  battleId:
                    type: string
                  subjects:
                    type: array
                    items:
                      type: string
                  status:
                    type: string
                required:
                - battleId
                - subjects
                - status
        '422':
          description: 同じクラス同士など不正な布告
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: クラスが存在しない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（school_admin は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                attackerClassId:
                  type: string
                  nullable: true
                  example: '1'
                  description: 宣戦布告する側のクラスID（省略時は布告者の所属クラス）
                defenderClassId:
                  type: string
                  example: '2'
                  description: 宣戦布告される側のクラスID
                subjects:
                  type: array
                  items:
                    type: string
                  example:
                  - math
                  - english
                  description: 対戦科目（召喚フィールド）
              required:
              - defenderClassId
              - subjects
        required: true
  "/api/battles/{id}/result":
    get:
      summary: バトル結果取得
      tags:
      - Battles
      security:
      - cookie_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: バトルID
        schema:
          type: string
      responses:
        '200':
          description: バトル結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  battleId:
                    type: string
                  winnerId:
                    type: string
                    nullable: true
                  loserId:
                    type: string
                    nullable: true
                  turnCount:
                    type: integer
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        turn:
                          type: integer
                        actorId:
                          type: string
                        action:
                          type: string
                        targetId:
                          type: string
                        damage:
                          type: integer
                      required:
                      - turn
                      - actorId
                      - action
                      - targetId
                      - damage
                required:
                - battleId
                - turnCount
                - logs
        '404':
          description: バトルが存在しない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/battles/{id}/token":
    get:
      summary: WebSocket接続用トークン発行
      tags:
      - Battles
      security:
      - cookie_auth: []
      description: Go Game Server への WebSocket 接続に使う JWT を発行する。バトルの参加者にのみ発行する。
      parameters:
      - name: id
        in: path
        required: true
        description: バトルID
        schema:
          type: string
      responses:
        '200':
          description: トークン発行成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                required:
                - token
        '403':
          description: バトルの参加者でない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: バトルが存在しない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/classes/assignments":
    patch:
      summary: クラス振り分けの一括反映
      tags:
      - Classes
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '200':
          description: 一括反映成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AssignmentUpdateResponse"
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: 一部不正時は全件ロールバックされる
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: assignments の要素が不正な形式
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      studentId:
                        type: integer
                      classId:
                        type: integer
                    required:
                    - studentId
                    - classId
              required:
              - assignments
        required: true
  "/api/classes":
    get:
      summary: クラス一覧取得
      tags:
      - Classes
      security:
      - cookie_auth: []
      parameters:
      - name: grade
        in: query
        required: false
        description: 学年で絞り込む（省略時は全学年）
        schema:
          type: integer
      responses:
        '200':
          description: school_admin もクラス一覧を取得できる
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ClassListResponse"
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/classes/{class_id}/students":
    get:
      summary: クラス内生徒一覧取得
      tags:
      - Classes
      security:
      - cookie_auth: []
      parameters:
      - name: class_id
        in: path
        required: true
        description: クラスID
        schema:
          type: integer
      responses:
        '200':
          description: school_admin もクラス内生徒一覧を取得できる
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ClassStudentListResponse"
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: クラスが存在しない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/exams":
    get:
      summary: 試験一覧取得
      tags:
      - Exams
      security:
      - cookie_auth: []
      responses:
        '200':
          description: student は自分のクラスの試験一覧を取得できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  exams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        subjectId:
                          type: string
                        createdBy:
                          type: string
                      required:
                      - id
                      - title
                      - subjectId
                      - createdBy
                required:
                - exams
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: 試験作成
      tags:
      - Exams
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '201':
          description: school_admin も試験を作成できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  subject:
                    type: string
                  class_id:
                    type: integer
                  max_score:
                    type: integer
                required:
                - id
                - title
                - subject
                - class_id
                - max_score
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: 数学 小テスト1
                subject:
                  type: string
                  example: math
                class_id:
                  type: integer
                  example: 1
                max_score:
                  type: integer
                  example: 100
              required:
              - title
              - subject
              - class_id
              - max_score
        required: true
  "/api/exams/{exam_id}/scores":
    get:
      summary: 試験別スコア一覧取得
      tags:
      - Exams
      security:
      - cookie_auth: []
      parameters:
      - name: exam_id
        in: path
        required: true
        description: 試験ID
        schema:
          type: string
      responses:
        '200':
          description: school_admin も試験別スコアを取得できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  examId:
                    type: string
                  scores:
                    type: array
                    items:
                      type: object
                      properties:
                        studentId:
                          type: string
                        name:
                          type: string
                        score:
                          type: integer
                      required:
                      - studentId
                      - name
                      - score
                required:
                - examId
                - scores
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/scores":
    get:
      summary: 自分の全試験スコア取得
      tags:
      - Scores
      security:
      - cookie_auth: []
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  scores:
                    type: array
                    items:
                      type: object
                      properties:
                        exam_id:
                          type: integer
                        exam_title:
                          type: string
                        subject:
                          type: string
                          example: math
                        subject_label:
                          type: string
                          example: 数学
                        score:
                          type: integer
                        max_score:
                          type: integer
                        scored_at:
                          type: string
                          format: date-time
                      required:
                      - exam_id
                      - exam_title
                      - subject
                      - subject_label
                      - score
                      - max_score
                      - scored_at
                required:
                - scores
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: 点数一括登録
      tags:
      - Scores
      security:
      - cookie_auth: []
      parameters: []
      responses:
        '201':
          description: school_admin も点数を登録できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  examId:
                    type: string
                  registeredCount:
                    type: integer
                required:
                - examId
                - registeredCount
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                examId:
                  type: string
                  example: exam_1
                scores:
                  type: array
                  items:
                    type: object
                    properties:
                      studentId:
                        type: string
                      score:
                        type: integer
                    required:
                    - studentId
                    - score
              required:
              - examId
              - scores
        required: true
  "/api/students/{id}/summon":
    get:
      summary: 召喚獣ステータス取得
      tags:
      - Students
      security:
      - cookie_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: 生徒ID
        schema:
          type: integer
      responses:
        '200':
          description: school_admin が他の生徒のステータスを参照できる
          content:
            application/json:
              schema:
                type: object
                properties:
                  studentId:
                    type: string
                  summons:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        label:
                          type: string
                        hp:
                          type: integer
                        attack:
                          type: integer
                        defense:
                          type: integer
                        speed:
                          type: integer
                      required:
                      - code
                      - label
                      - hp
                      - attack
                      - defense
                      - speed
                required:
                - studentId
                - summons
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（他の生徒による参照は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/students/{id}/class":
    patch:
      summary: 生徒のクラス変更
      tags:
      - Students
      security:
      - cookie_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: 生徒ID
        schema:
          type: integer
      responses:
        '200':
          description: クラス変更成功
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ClassChangeResponse"
        '401':
          description: 未認証
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '403':
          description: 権限なし（student は禁止）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: 生徒が存在しない
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                class_id:
                  type: integer
                  description: 変更先クラスID
              required:
              - class_id
        required: true
  "/api/me":
    get:
      summary: 認証ユーザー情報取得
      tags:
      - Users
      security:
      - cookie_auth: []
      responses:
        '200':
          description: 自分のユーザー情報
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: 未認証（token Cookie なし）
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
servers:
- url: http://localhost:8000
  description: ローカル開発環境
components:
  securitySchemes:
    cookie_auth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    Role:
      type: string
      enum:
      - student
      - teacher
      - school_admin
    AuthResponse:
      type: object
      properties:
        user:
          "$ref": "#/components/schemas/User"
      required:
      - user
    SchoolClass:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          "$ref": "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        school_class:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
      required:
      - id
      - name
      - email
      - role
      - created_at
      - school_class
    ClassSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        grade:
          type: integer
        averageScore:
          type: integer
        studentCount:
          type: integer
      required:
      - id
      - name
      - grade
      - averageScore
      - studentCount
    ClassListResponse:
      type: object
      properties:
        classes:
          type: array
          items:
            "$ref": "#/components/schemas/ClassSummary"
      required:
      - classes
    ClassStudent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        grade:
          type: integer
        totalScore:
          type: integer
        topSubject:
          type: object
          properties:
            name:
              type: string
            score:
              type: integer
          required:
          - name
          - score
      required:
      - id
      - name
      - grade
      - totalScore
      - topSubject
    ClassStudentListResponse:
      type: object
      properties:
        classId:
          type: integer
        students:
          type: array
          items:
            "$ref": "#/components/schemas/ClassStudent"
      required:
      - classId
      - students
    AssignmentUpdateResponse:
      type: object
      properties:
        updatedCount:
          type: integer
      required:
      - updatedCount
    ClassChangeResponse:
      type: object
      properties:
        studentId:
          type: integer
        schoolClass:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            grade:
              type: integer
          required:
          - id
          - name
          - grade
      required:
      - studentId
      - schoolClass
    AdminUserSummary:
      type: object
      properties:
        student_count:
          type: integer
        teacher_count:
          type: integer
        admin_count:
          type: integer
        total_count:
          type: integer
      required:
      - student_count
      - teacher_count
      - admin_count
      - total_count
    AdminUserCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: 鈴木先生
        email:
          type: string
          example: teacher@example.com
        password:
          type: string
          example: password123
        role:
          "$ref": "#/components/schemas/Role"
      required:
      - name
      - email
      - password
      - role
    AdminUserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: 霧島翔子
        email:
          type: string
          example: kirishima@example.com
        password:
          type: string
          example: password123
          description: 未指定なら変更しない
        role:
          "$ref": "#/components/schemas/Role"
      required:
      - name
      - email
      - role
    error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
          required:
          - code
          - message
          - details
      required:
      - error
