version: '3'

tasks:
  default:
    aliases:
      - list
    desc: タスク一覧
    cmd: task -l

  install:
    desc: プロジェクトの依存関係をまとめてインストール
    deps:
      - task: backend:install-deps
      - task: frontend:install-deps
  
  dev:
    desc: プロジェクトの開発サーバーをまとめて起動
    deps:
      - task: dev:backend
      - task: dev:frontend
  
  dev:backend:
    desc: バックエンドの開発サーバーを起動
    dir: ./backend
    cmd: bundle exec rails server

  dev:frontend:
    desc: フロントエンドの開発サーバーを起動
    dir: ./frontend
    deps:
      - frontend:install-deps
    cmd: pnpm run dev
  
  backend:install-deps:
    desc: バックエンドの依存関係をインストール
    dir: ./backend
    cmd: bundle install

  frontend:install-deps:
    desc: フロントエンドの依存関係をインストール
    dir: ./frontend
    cmd: pnpm install --frozen-lockfile

  db:start:
    desc: PostgreSQLをdocker-composeで起動し、healthyになるまで待つ
    dotenv: [".env"]
    cmds:
      - docker compose up -d db
      - until docker compose exec db pg_isready -U ${DB_USERNAME} > /dev/null 2>&1; do sleep 1; done
      - echo "PostgreSQL ready"

  db:stop:
    desc: PostgreSQLを停止する
    cmd: docker compose stop db

  db:create:
    desc: データベースを作成する
    dir: ./backend
    cmd: bundle exec rails db:create

  db:migrate:
    desc: マイグレーションを実行する
    dir: ./backend
    cmd: bundle exec rails db:migrate

  db:seed:
    desc: シードデータを投入する
    dir: ./backend
    cmd: bundle exec rails db:seed

  db:setup:
    desc: DB作成・マイグレーション・シードをまとめて実行する
    dir: ./backend
    cmd: bundle exec rails db:setup

  db:reset:
    desc: DBをリセットして再セットアップする（開発用）
    dir: ./backend
    cmd: bundle exec rails db:reset

  db:rollback:
    desc: 直近のマイグレーションをロールバックする
    dir: ./backend
    cmd: bundle exec rails db:rollback

  db:status:
    desc: マイグレーションの状態を確認する
    dir: ./backend
    cmd: bundle exec rails db:migrate:status
