version: '3'

tasks:
  default:
    aliases:
      - list
    desc: タスク一覧
    cmd: task -l

  install-deps:
    desc: フロントエンドの依存関係をインストール
    cmd: pnpm install --frozen-lockfile

  dev:
    desc: フロントエンドの開発サーバーを起動
    cmd: pnpm dev

  build:
    desc: フロントエンドをビルドする
    cmd: pnpm build

  lint:
    desc: ESLintでコードスタイルをチェックする
    cmd: pnpm lint

  test:
    desc: Vitestでテストを実行する
    cmd: pnpm test

  ci:
    desc: CI相当のチェックをローカルで全て実行する（generate + lint + test + build）
    cmds:
      - task: generate
      - task: lint
      - task: test
      - task: build

  generate:
    desc: OpenAPIスキーマからTypeScriptの型定義を生成する
    cmd: pnpm run generate