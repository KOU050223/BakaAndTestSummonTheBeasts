version: '3'

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
    internal: true
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend
    internal: true
  game:
    taskfile: ./game/Taskfile.yml
    dir: ./game
    internal: true

tasks:
  default:
    aliases:
      - list
    desc: タスク一覧
    cmd: task -l

  install:
    desc: 全サービスの依存関係をまとめてインストール
    deps:
      - task: backend:install-deps
      - task: frontend:install-deps
      - task: hooks:install

  hooks:install:
    desc: lefthookのgitフックをインストールする
    cmd: lefthook install

  dev:
    desc: 全サービスの開発サーバーをまとめて起動
    deps:
      - task: backend:dev
      # - task: backend:jobs
      - task: frontend:dev
      - task: game:dev

  lint:
    desc: 全サービスのlintをまとめて実行する
    deps:
      - task: backend:lint
      - task: frontend:lint

  lint:fix:
    desc: 全サービスのlintを自動修正する
    deps:
      - task: backend:lint:fix

  test:
    desc: 全サービスのテストをまとめて実行する
    deps:
      - task: backend:test
      - task: frontend:test

  scan:
    desc: 全サービスのセキュリティスキャンをまとめて実行する
    deps:
      - task: backend:scan

  ci:
    desc: 全サービスのCIチェックをローカルで全て実行する
    cmds:
      - task: backend:ci
      - task: frontend:ci

  setup:
    desc: 🚀 新規参加者向けセットアップ（install → .env → DB起動 → DB初期化 まで一括実行）
    cmds:
      - task: setup:check-tools
      - task: setup:copy-env
      - task: setup:install
      - task: setup:db
      - task: setup:done

  setup:check-tools:
    desc: 必要ツールの存在確認
    silent: true
    cmds:
      - |
        echo "🔍 必要なツールを確認しています..."
        MISSING=()

        if ! command -v docker &>/dev/null; then
          MISSING+=("docker")
        fi
        if ! command -v bundle &>/dev/null; then
          MISSING+=("bundler (gem install bundler)")
        fi
        if ! command -v pnpm &>/dev/null; then
          MISSING+=("pnpm (npm install -g pnpm)")
        fi
        if ! command -v lefthook &>/dev/null; then
          MISSING+=("lefthook (brew install lefthook)")
        fi

        if [ ${#MISSING[@]} -gt 0 ]; then
          echo ""
          echo "❌ 以下のツールがインストールされていません:"
          for tool in "${MISSING[@]}"; do
            echo "   - $tool"
          done
          echo ""
          echo "💡 上記ツールをインストールしてから再度 'task setup' を実行してください。"
          exit 1
        fi

        echo "✅ 必要なツールがすべて揃っています"

  setup:copy-env:
    desc: .env ファイルをコピー（存在しない場合のみ）
    silent: true
    cmds:
      - |
        echo ""
        echo "📄 .env ファイルを確認しています..."

        # ルートの .env
        if [ ! -f ".env" ]; then
          cp .env.example .env
          echo "✅ .env を .env.example からコピーしました"
          echo "   ⚠️  .env を開いて DB_PASSWORD を設定してください"
        else
          echo "✅ .env は既に存在します（スキップ）"
        fi

        # backend/.env
        if [ ! -f "backend/.env" ]; then
          cp backend/.env.example backend/.env
          echo "✅ backend/.env を backend/.env.example からコピーしました"
          echo "   ⚠️  backend/.env を開いて DB_PASSWORD を設定してください"
        else
          echo "✅ backend/.env は既に存在します（スキップ）"
        fi

        # game/.env
        if [ ! -f "game/.env" ]; then
          cp game/.env.example game/.env
          echo "✅ game/.env を game/.env.example からコピーしました"
        else
          echo "✅ game/.env は既に存在します（スキップ）"
        fi

        echo ""
        echo "⚠️  backend/.env と game/.env の以下の値を、手動で同じ値に設定してください:"
        echo "   - JWT_SECRET_KEY"
        echo "   - INTERNAL_API_SECRET"
        echo "   生成例: openssl rand -hex 64"

  setup:install:
    desc: 依存関係のインストール
    silent: true
    cmds:
      - |
        echo ""
        echo "📦 依存関係をインストールしています..."
      - task: backend:install-deps
      - task: frontend:install-deps
      - task: hooks:install
      - |
        echo "✅ 依存関係のインストール完了"

  setup:db:
    desc: DB起動 → 作成 → マイグレーション → シード
    silent: true
    dotenv: [".env"]
    cmds:
      - |
        echo ""
        echo "🐘 PostgreSQL を起動しています..."

        # Docker が起動しているか確認
        if ! docker info &>/dev/null 2>&1; then
          echo ""
          echo "❌ Docker が起動していません。"
          echo "💡 Docker Desktop を起動してから再度 'task setup' を実行してください。"
          exit 1
        fi

        # DB_PORT が使用済みか確認
        DB_PORT="${DB_PORT:-5432}"
        if lsof -iTCP:"$DB_PORT" -sTCP:LISTEN &>/dev/null 2>&1; then
          # 自分の docker compose の db コンテナが使っているか確認
          CONTAINER=$(docker compose ps -q db 2>/dev/null)
          if [ -z "$CONTAINER" ]; then
            echo ""
            echo "❌ ポート $DB_PORT がすでに使用されています。"
            echo "💡 別の PostgreSQL が起動していないか確認してください:"
            echo "   lsof -iTCP:$DB_PORT -sTCP:LISTEN"
            exit 1
          fi
        fi

        docker compose up -d --wait db
        if [ $? -ne 0 ]; then
          echo ""
          echo "❌ PostgreSQL コンテナの起動に失敗しました。"
          echo "💡 以下を確認してください:"
          echo "   - .env の DB_USERNAME / DB_PASSWORD が正しいか"
          echo "   - docker compose logs db  でエラー内容を確認する"
          exit 1
        fi
        echo "✅ PostgreSQL が起動しました"

      - |
        echo ""
        echo "🗄️  データベースをセットアップしています..."
        cd backend && bundle exec rails db:setup
        if [ $? -ne 0 ]; then
          echo ""
          echo "❌ データベースのセットアップに失敗しました。"
          echo "💡 以下を確認してください:"
          echo "   - .env と backend/.env の DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD が正しいか"
          echo "   - 'task db:start' で DB が起動しているか"
          echo "   - 'docker compose logs db' でコンテナのエラーを確認する"
          exit 1
        fi
        echo "✅ データベースのセットアップ完了"

  setup:done:
    desc: セットアップ完了メッセージ
    silent: true
    cmd: |
      echo ""
      echo "╔══════════════════════════════════════════════╗"
      echo "║  🎉 セットアップが完了しました！              ║"
      echo "╠══════════════════════════════════════════════╣"
      echo "║  開発サーバーを起動するには:                  ║"
      echo "║    task dev                                  ║"
      echo "║                                              ║"
      echo "║  その他のコマンドを確認するには:              ║"
      echo "║    task                                      ║"
      echo "╚══════════════════════════════════════════════╝"

  db:start:
    desc: PostgreSQLをdocker-composeで起動し、healthyになるまで待つ
    dotenv: [".env"]
    cmd: docker compose up -d --wait db

  db:stop:
    desc: PostgreSQLを停止する
    cmd: docker compose stop db

  db:create:
    desc: データベースを作成する
    dir: ./backend
    cmd: bundle exec rails db:create

  db:migrate:
    desc: マイグレーションを実行する
    dir: ./backend
    cmd: bundle exec rails db:migrate

  db:seed:
    desc: シードデータを投入する
    dir: ./backend
    cmd: bundle exec rails db:seed

  db:setup:
    desc: DB作成・マイグレーション・シードをまとめて実行する
    dir: ./backend
    cmd: bundle exec rails db:setup

  db:reset:
    desc: DBをリセットして再セットアップする（開発用）
    dir: ./backend
    cmd: bundle exec rails db:reset

  db:rollback:
    desc: 直近のマイグレーションをロールバックする
    dir: ./backend
    cmd: bundle exec rails db:rollback

  db:status:
    desc: マイグレーションの状態を確認する
    dir: ./backend
    cmd: bundle exec rails db:migrate:status
