version: '3'

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
    internal: true
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend
    internal: true

tasks:
  default:
    aliases:
      - list
    desc: タスク一覧
    cmd: task -l

  install:
    desc: 全サービスの依存関係をまとめてインストール
    deps:
      - task: backend:install-deps
      - task: frontend:install-deps
      - task: hooks:install

  hooks:install:
    desc: lefthookのgitフックをインストールする
    cmd: lefthook install

  dev:
    desc: 全サービスの開発サーバーをまとめて起動
    deps:
      - task: backend:dev
      - task: backend:jobs
      - task: frontend:dev

  lint:
    desc: 全サービスのlintをまとめて実行する
    deps:
      - task: backend:lint
      - task: frontend:lint

  lint:fix:
    desc: 全サービスのlintを自動修正する
    deps:
      - task: backend:lint:fix

  test:
    desc: 全サービスのテストをまとめて実行する
    deps:
      - task: backend:test
      - task: frontend:test

  scan:
    desc: 全サービスのセキュリティスキャンをまとめて実行する
    deps:
      - task: backend:scan

  ci:
    desc: 全サービスのCIチェックをローカルで全て実行する
    cmds:
      - task: backend:ci
      - task: frontend:ci

  db:start:
    desc: PostgreSQLをdocker-composeで起動し、healthyになるまで待つ
    dotenv: [".env"]
    cmd: docker compose up -d --wait db

  db:stop:
    desc: PostgreSQLを停止する
    cmd: docker compose stop db

  db:create:
    desc: データベースを作成する
    dir: ./backend
    cmd: bundle exec rails db:create

  db:migrate:
    desc: マイグレーションを実行する
    dir: ./backend
    cmd: bundle exec rails db:migrate

  db:seed:
    desc: シードデータを投入する
    dir: ./backend
    cmd: bundle exec rails db:seed

  db:setup:
    desc: DB作成・マイグレーション・シードをまとめて実行する
    dir: ./backend
    cmd: bundle exec rails db:setup

  db:reset:
    desc: DBをリセットして再セットアップする（開発用）
    dir: ./backend
    cmd: bundle exec rails db:reset

  db:rollback:
    desc: 直近のマイグレーションをロールバックする
    dir: ./backend
    cmd: bundle exec rails db:rollback

  db:status:
    desc: マイグレーションの状態を確認する
    dir: ./backend
    cmd: bundle exec rails db:migrate:status

