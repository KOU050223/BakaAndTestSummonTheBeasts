version: '3'

includes:
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
    internal: true
  # frontend:
  #   taskfile: ./frontend/Taskfile.yml
  #   dir: ./frontend
  #   internal: true

tasks:
  default:
    aliases:
      - list
    desc: タスク一覧
    cmd: task -l

  install:
    desc: 全サービスの依存関係をまとめてインストール
    deps:
      - task: backend:install-deps
      # - task: frontend:install-deps

  dev:
    desc: 全サービスの開発サーバーをまとめて起動
    deps:
      - task: backend:dev
      # - task: frontend:dev

  lint:
    desc: 全サービスのlintをまとめて実行する
    deps:
      - task: backend:lint
      # - task: frontend:lint

  lint:fix:
    desc: 全サービスのlintを自動修正する
    deps:
      - task: backend:lint:fix
      # - task: frontend:lint:fix

  test:
    desc: 全サービスのテストをまとめて実行する
    deps:
      - task: backend:test
      # - task: frontend:test

  test:system:
    desc: 全サービスのシステムテストをまとめて実行する
    deps:
      - task: backend:test:system

  scan:
    desc: 全サービスのセキュリティスキャンをまとめて実行する
    deps:
      - task: backend:scan

  ci:
    desc: 全サービスのCIチェックをローカルで全て実行する
    cmds:
      - task: backend:ci
      # - task: frontend:ci

  db:start:
    desc: PostgreSQLをdocker-composeで起動し、healthyになるまで待つ
    dotenv: [".env"]
    cmds:
      - docker compose up -d db
      - until docker compose exec db pg_isready -U ${DB_USERNAME} > /dev/null 2>&1; do sleep 1; done
      - echo "PostgreSQL ready"

  db:stop:
    desc: PostgreSQLを停止する
    cmd: docker compose stop db

  db:create:
    desc: データベースを作成する
    cmd: task backend:db:create

  db:migrate:
    desc: マイグレーションを実行する
    cmd: task backend:db:migrate

  db:seed:
    desc: シードデータを投入する
    cmd: task backend:db:seed

  db:setup:
    desc: DB作成・マイグレーション・シードをまとめて実行する
    cmd: task backend:db:setup

  db:reset:
    desc: DBをリセットして再セットアップする（開発用）
    cmd: task backend:db:reset

  db:rollback:
    desc: 直近のマイグレーションをロールバックする
    cmd: task backend:db:rollback

  db:status:
    desc: マイグレーションの状態を確認する
    cmd: task backend:db:status
